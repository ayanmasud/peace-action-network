<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Admin Login | Peace Action Network
    </title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>


<body class="admin-body">

<main class="admin-login-page">

    <div class="admin-login-card">

        <div class="admin-logo">
            🔐
        </div>

        <h1>
            Peace Action Network
        </h1>

        <h2>
            Admin Login
        </h2>

        <p>
            Enter the administrator password
            to manage events.
        </p>


        <form id="login-form">

            <label for="password">
                Admin Password
            </label>

            <input
                id="password"
                type="password"
                autocomplete="current-password"
                required
            >


            <button
                class="admin-primary-btn full-width"
                type="submit"
            >
                Sign In
            </button>


            <p
                id="login-error"
                class="form-error"
            ></p>

        </form>


        <a
            class="back-link"
            href="index.html"
        >
            ← Back to website
        </a>

    </div>

</main>


<script>

document.addEventListener(
    "DOMContentLoaded",
    async () => {

        const form =
            document.getElementById(
                "login-form"
            );

        const password =
            document.getElementById(
                "password"
            );

        const error =
            document.getElementById(
                "login-error"
            );


        const statusResponse =
            await fetch(
                "/api/admin/status"
            );


        const status =
            await statusResponse.json();


        if (
            status.authenticated
        ) {

            window.location.href =
                "/admin.html";

            return;
        }


        form.addEventListener(
            "submit",
            async event => {

                event.preventDefault();

                error.textContent = "";


                const response =
                    await fetch(
                        "/api/admin/login",
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    password:
                                        password.value
                                })
                        }
                    );


                const data =
                    await response
                        .json()
                        .catch(
                            () => ({})
                        );


                if (
                    response.ok
                ) {

                    window.location.href =
                        "/admin.html";

                } else {

                    error.textContent =
                        data.error ||
                        "Incorrect password.";

                    password.select();
                }

            }
        );

    }
);

</script>

</body>
</html>
